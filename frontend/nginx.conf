server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь без файла отдаём в index.html, иначе перезагрузка
    # /chat или /protocols даёт 404 (роутинг живёт в React, не в nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API под тем же origin: фронтенд ходит на /v1/..., nginx проксирует в
    # backend. Без этого браузер обращался к http://localhost:8000 напрямую —
    # работало только при опубликованном порту и разрешённом CORS.
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/chat/stream): без этого ответ буферизуется и «поток»
        # приходит одним пакетом.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Статика Vite: хэши в имени, поэтому кэш надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
