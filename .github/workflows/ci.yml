name: LORAI CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python scripts/seed_synthetic_data.py
      - run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lorai.log 2>&1 & sleep 12 && curl -sf http://127.0.0.1:8000/health
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: npx playwright test e2e.ci.spec.ts
        working-directory: frontend
