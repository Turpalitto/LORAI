name: LORAI CI
# Что здесь есть: тесты backend, tsc/vitest/сборка frontend, e2e на
# синтетическом корпусе.
#
# Чего здесь НЕТ и почему: гейт качества поиска (eval_retrieval + инварианты).
# Он требует корпуса КР, а PDF не коммитятся (17 МБ чужих документов), поэтому
# на GitHub-hosted runner индекса не собрать. Прежний job `eval` был красным с
# момента добавления — то есть гейтом не был. Запуск: scripts/check_retrieval_gate.sh
# на машине с корпусом (KNOWN_ISSUES, 1.10.0).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Версия Node из .nvmrc, а не «20 по памяти»: расхождение с локальной
          # сборкой давало падения rollup на нативном бинарнике.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      # vitest раньше не запускался в CI вообще: юнит-тесты фронтенда жили
      # только на машине разработчика.
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python scripts/seed_synthetic_data.py
      - run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lorai.log 2>&1 & sleep 12 && curl -sf http://127.0.0.1:8000/health
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: npx playwright test e2e.ci.spec.ts
        working-directory: frontend
